name: CI

on:
  push:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: Política de branches
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_BRANCH: ${{ github.base_ref }}
      HEAD_BRANCH: ${{ github.head_ref }}

    steps:
      - name: Validar origem do pull request
        run: |
          if [[ "$BASE_BRANCH" == "main" && "$HEAD_BRANCH" != "dev" ]]; then
            echo "A branch main aceita pull requests somente da branch dev."
            exit 1
          fi

  quality:
    name: Qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # O Prisma Client só precisa que a variável exista para ser gerado;
      # esta URL não se conecta a banco algum durante esta etapa.
      DATABASE_URL: postgresql://auth:ci-password@localhost:5432/auth?schema=public

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npm run prisma:generate

      - name: Executar lint
        run: npm run lint

      - name: Executar testes unitários
        run: npm test

      - name: Executar testes E2E
        run: npm run test:e2e

      - name: Validar build
        run: npm run build
